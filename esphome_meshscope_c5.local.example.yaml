packages:
  meshscope: !include esphome_meshscope_c5.yaml
  # Optional remote access. Uncomment this package and fill in the WireGuard
  # substitutions below. The same package also works with C3 and C6 targets.
  # wireguard: !include esphome_meshscope_wireguard.yaml

substitutions:
  # Copy this file to esphome_meshscope_c5.local.yaml; never commit the copy.
  meshscope_wifi_ssid: "YOUR_WIFI_SSID"
  meshscope_wifi_password: "YOUR_WIFI_PASSWORD"
  meshscope_router_host: "192.168.1.1"
  # Generate with: python3 tools/encode_secret.py
  meshscope_router_password_b64: "YOUR_BASE64_ENCODED_LINKSYS_LOCAL_PASSWORD"
  # Unlocks the dashboard and its APIs. No username is required.
  meshscope_dashboard_password: "YOUR_UNIQUE_DASHBOARD_PASSWORD"
  # Generate with: openssl rand -base64 32
  meshscope_api_key: "YOUR_32_BYTE_BASE64_ESPHOME_API_KEY"
  meshscope_ota_password: "YOUR_UNIQUE_OTA_PASSWORD"
  meshscope_timezone: "Etc/UTC"
  # auto keeps full client details when memory allows; full and nodes-only override it.
  meshscope_client_details: "auto"
  # auto is recommended; force-on bypasses only capability gating, and
  # force-off disables all MQTT probes and Parent steering publishes.
  meshscope_mqtt_parent_steering: "auto"
  # WireGuard values are only required when the package above is enabled.
  # Generate a dedicated device key pair; never reuse or commit private keys.
  # meshscope_wireguard_address: "10.23.0.48"
  # Keep /32 for inbound-only dashboard and Home Assistant access.
  # meshscope_wireguard_netmask: "255.255.255.255"
  # meshscope_wireguard_private_key: "YOUR_DEVICE_PRIVATE_KEY"
  # meshscope_wireguard_peer_endpoint: "vpn.example.com"
  # meshscope_wireguard_peer_port: "51820"
  # meshscope_wireguard_peer_public_key: "YOUR_SERVER_PUBLIC_KEY"
  # meshscope_wireguard_peer_preshared_key: "YOUR_PRESHARED_KEY"
  # meshscope_wireguard_tunnel_network: "10.23.0.0/24"
  # This remote network must not overlap the ESP32 Wi-Fi/router LAN.
  # meshscope_wireguard_ha_network: "192.168.50.0/24"
  # meshscope_wireguard_keepalive: "25s"
