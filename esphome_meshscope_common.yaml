substitutions:
  meshscope_wifi_ssid: "SET_IN_LOCAL_CONFIG"
  meshscope_wifi_password: "SET_IN_LOCAL_CONFIG"
  meshscope_router_host: "192.168.1.1"
  meshscope_router_password_b64: "SET_IN_LOCAL_CONFIG"
  meshscope_api_key: "SET_IN_LOCAL_CONFIG"
  meshscope_ota_password: "SET_IN_LOCAL_CONFIG"
  meshscope_timezone: "UTC"
  meshscope_client_details: "auto"
  # auto requires a live MQTT ACL roundtrip; force-on only bypasses that
  # capability gate, while force-off prevents all MQTT probes and publishes.
  meshscope_mqtt_parent_steering: "auto"

esphome:
  min_version: 2026.7.2
  includes:
    - esphome_includes/meshscope_web_assets.h
    - esphome_includes/meshscope_edge.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          meshscope_edge_setup(
              "${meshscope_router_host}",
              "${meshscope_router_password_b64}",
              "${meshscope_client_details}",
              "${meshscope_mqtt_parent_steering}");

logger:
  baud_rate: 115200
  hardware_uart: UART0
  level: INFO

wifi:
  ssid: "${meshscope_wifi_ssid}"
  password: "${meshscope_wifi_password}"
  power_save_mode: NONE
  # Remember the last successful mesh AP and channel. This lets ESPHome try a
  # direct reconnect before scanning every beacon again when the Linksys mesh
  # is reconverging (and avoids a known-fragile ESP32-C5 scan path).
  fast_connect:
    enabled: true
    storage: flash
  post_connect_roaming: false
  reboot_timeout: 5min

api:
  # Keep the recovery reboot enabled, but do not preempt the optional
  # WireGuard 10-minute watchdog merely because HA is reached over that tunnel.
  reboot_timeout: 15min
  encryption:
    key: "${meshscope_api_key}"

ota:
  - platform: esphome
    password: "${meshscope_ota_password}"

time:
  - platform: sntp
    id: meshscope_clock
    timezone: "${meshscope_timezone}"

binary_sensor:
  - platform: template
    name: Router Connected
    id: meshscope_router_connected
    device_class: connectivity
    lambda: return meshscope_edge_router_connected();
  - platform: template
    name: Topology Lock Active
    id: meshscope_topology_lock_active
    icon: mdi:lock-check
    lambda: return meshscope_edge_topology_lock_active();
  - platform: template
    name: MQTT Parent Steering Available
    id: meshscope_mqtt_parent_available
    icon: mdi:lan-connect
    lambda: return meshscope_edge_mqtt_parent_available();

number:
  - platform: template
    name: Topology Lock Action Rate Limit
    id: meshscope_topology_lock_rate_limit
    icon: mdi:timer-cog-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 86400
    step: 1
    mode: box
    lambda: return meshscope_edge_topology_lock_rate_limit_seconds();
    set_action:
      - lambda: meshscope_edge_set_topology_lock_rate_limit_seconds(x);
    update_interval: 10s

sensor:
  - platform: template
    name: Online Mesh Nodes
    id: meshscope_nodes_online
    accuracy_decimals: 0
    lambda: return meshscope_edge_nodes_online();
    update_interval: 10s
  - platform: template
    name: Total Mesh Nodes
    id: meshscope_nodes_total
    accuracy_decimals: 0
    lambda: return meshscope_edge_nodes_total();
    update_interval: 10s
  - platform: template
    name: Online Clients
    id: meshscope_clients_online
    accuracy_decimals: 0
    lambda: return meshscope_edge_clients_online();
    update_interval: 10s
  - platform: template
    name: Weak Mesh Nodes
    id: meshscope_weak_nodes
    accuracy_decimals: 0
    lambda: return meshscope_edge_weak_nodes();
    update_interval: 10s
  - platform: template
    name: Backhaul Total
    id: meshscope_backhaul_mbps
    unit_of_measurement: Mbps
    accuracy_decimals: 1
    lambda: return meshscope_edge_backhaul_mbps();
    update_interval: 10s
  - platform: template
    name: ESP32 Free Heap
    id: meshscope_free_heap
    unit_of_measurement: B
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: return meshscope_edge_free_heap();
    update_interval: 30s
  - platform: template
    name: Topology Lock Issues
    id: meshscope_topology_lock_issues
    icon: mdi:lan-disconnect
    accuracy_decimals: 0
    lambda: return meshscope_edge_topology_lock_issues();
    update_interval: 10s

text_sensor:
  - platform: template
    name: MeshScope URL
    id: meshscope_url
    icon: mdi:web
    lambda: return meshscope_edge_url();
    update_interval: 30s
  - platform: template
    name: Topology Summary
    id: meshscope_topology_summary
    icon: mdi:access-point-network
    lambda: return meshscope_edge_summary();
    update_interval: 10s
  - platform: template
    name: Last Topology Update
    id: meshscope_last_update
    icon: mdi:clock-outline
    lambda: return meshscope_edge_last_update();
    update_interval: 10s
  - platform: template
    name: Topology Lock Summary
    id: meshscope_topology_lock_summary
    icon: mdi:lock-check
    lambda: return meshscope_edge_topology_lock_summary();
    update_interval: 10s
  - platform: template
    name: MQTT Parent Steering Mode
    id: meshscope_mqtt_parent_mode
    icon: mdi:source-branch
    entity_category: diagnostic
    lambda: return meshscope_edge_mqtt_parent_mode();
    update_interval: 30s
  - platform: template
    name: Last Parent Steering Result
    id: meshscope_mqtt_parent_result
    icon: mdi:swap-horizontal
    lambda: return meshscope_edge_mqtt_parent_result();
    update_interval: 10s

button:
  - platform: template
    name: Refresh Mesh Topology
    id: meshscope_refresh
    icon: mdi:refresh
    on_press:
      - lambda: meshscope_edge_force_refresh();
