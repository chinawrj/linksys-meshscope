user root
pid_file /tmp/meshscope-plan-a-mosquitto.pid
per_listener_settings true
log_dest stderr
log_type all
connection_messages true

# Isolated simulation of the stock default/LAN listener using Plan A. The
# firmware uses the legacy bind_address + port directives for this listener.
bind_address 127.0.0.1
port 21884
allow_anonymous true
acl_file /tmp/meshscope-plan-a-test.acl

# Simulated stock localhost/system listener used by internal publishers and
# subscribers. This listener intentionally has no ACL, matching the firmware.
listener 21885 localhost
allow_anonymous true
