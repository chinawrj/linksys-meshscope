name: Test MeshScope

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check Python syntax
        run: python -m py_compile linksys_mesh_app.py

      - name: Check English-only repository text
        run: |
          if git grep -nP '[\x{4e00}-\x{9fff}]'; then
            echo "CJK characters found. Keep public project text in English."
            exit 1
          fi

      - name: Validate ESPHome configuration
        run: |
          python -m pip install -r requirements-esphome.txt
          esphome config esphome_meshscope_c5.ci.yaml

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check JavaScript syntax
        run: |
          node --check mesh_web/app.js
          node --check mesh_web/connection-mode.js
          node --check mesh_web/detail-data.js
          node --check mesh_web/linksys-normalize.js
          node --check mesh_web/node-restart-state.js
          node --check mesh_web/refresh-state.js
          node --check mesh_web/topology-layout.js

      - name: Run JavaScript tests
        run: |
          node --test \
            tests/test_connection_mode.js \
            tests/test_refresh_state.js \
            tests/test_topology_layout.js \
            tests/test_detail_data.js \
            tests/test_node_restart_state.js \
            tests/test_linksys_normalize.js
